<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14211e"/>
      <stop offset="60%" stop-color="#283e38"/>
      <stop offset="100%" stop-color="#e8d3b9"/>
    </linearGradient>
    <linearGradient id="mountains" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3f37"/>
      <stop offset="100%" stop-color="#13231d"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky2)"/>
  
  <!-- Soft Sunrise Sun -->
  <circle cx="400" cy="220" r="80" fill="#fca5a5" opacity="0.7"/>

  <!-- Distant Mountains -->
  <polygon points="0,320 200,180 440,310 650,190 800,300 800,500 0,500" fill="url(#mountains)" opacity="0.9"/>
  <polygon points="120,340 320,240 500,330 680,260 800,340 800,500 0,500" fill="#1b2a24"/>

  <!-- Pagoda & Zen Architecture -->
  <g transform="translate(480, 190)">
    <!-- Pagoda Tier 3 -->
    <path d="M 40 40 L 100 40 L 70 15 Z" fill="#b91c1c"/>
    <path d="M 25 45 C 50 35 90 35 115 45 L 70 38 Z" fill="#1c1917"/>
    <!-- Tier 2 -->
    <rect x="50" y="45" width="40" height="25" fill="#e7e5e4"/>
    <path d="M 15 75 C 50 60 90 60 125 75 L 70 68 Z" fill="#1c1917"/>
    <!-- Tier 1 -->
    <rect x="40" y="75" width="60" height="35" fill="#e7e5e4"/>
    <path d="M 5 115 C 50 95 90 95 135 115 L 70 108 Z" fill="#1c1917"/>
    <!-- Base -->
    <rect x="30" y="115" width="80" height="60" fill="#292524"/>
    <!-- Warm Paper Windows -->
    <rect x="45" y="130" width="18" height="25" fill="#fef08a"/>
    <rect x="75" y="130" width="18" height="25" fill="#fef08a"/>
  </g>

  <!-- Torii Gate Silhouette Left -->
  <g transform="translate(140, 240)">
    <rect x="15" y="40" width="12" height="150" fill="#dc2626"/>
    <rect x="85" y="40" width="12" height="150" fill="#dc2626"/>
    <!-- Roof lintel -->
    <path d="M 0 35 Q 55 25 112 35 L 112 45 Q 55 35 0 45 Z" fill="#1c1917"/>
    <rect x="8" y="55" width="96" height="8" fill="#dc2626"/>
  </g>

  <!-- Bamboo & Evergreen Foregrounds -->
  <rect x="0" y="430" width="800" height="70" fill="#0c1613"/>
  <circle cx="100" cy="460" r="80" fill="#13231d" opacity="0.9"/>
  <circle cx="280" cy="470" r="90" fill="#172b23" opacity="0.9"/>
  <circle cx="680" cy="460" r="100" fill="#13231d" opacity="0.9"/>

  <!-- Watermark Badge -->
  <rect x="40" y="40" width="230" height="48" rx="8" fill="#000000" fill-opacity="0.45"/>
  <text x="60" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="1.5">KYOTO, JAPAN</text>
</svg>
