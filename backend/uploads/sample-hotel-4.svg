<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="sea4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Santorini Sunset Sky -->
  <rect width="800" height="340" fill="url(#sky4)"/>
  
  <!-- Setting Sun on Aegean Horizon -->
  <circle cx="280" cy="270" r="45" fill="#fef08a"/>
  
  <!-- Sea -->
  <rect y="310" width="800" height="190" fill="url(#sea4)"/>
  <!-- Sunset reflection on water -->
  <polygon points="230,310 330,310 380,500 180,500" fill="#f97316" opacity="0.35"/>

  <!-- Caldera Volcanic Cliff (Dark rock) -->
  <polygon points="350,500 420,260 520,200 800,120 800,500" fill="#2d2327"/>

  <!-- Whitewashed Luxury Cave Suites on Cliff -->
  <!-- Suite Level 1 -->
  <rect x="520" y="240" width="90" height="70" rx="4" fill="#ffffff"/>
  <!-- Blue Dome Church -->
  <path d="M 640 220 Q 675 160 710 220 Z" fill="#2563eb"/>
  <rect x="645" y="220" width="60" height="50" fill="#ffffff"/>
  <circle cx="675" cy="158" r="4" fill="#fbbf24"/>

  <!-- Suite Level 2 with Cave Arch -->
  <rect x="590" y="270" width="110" height="80" rx="4" fill="#f8fafc"/>
  <path d="M 625 350 L 625 310 Q 645 295 665 310 L 665 350 Z" fill="#0f172a"/>

  <!-- Suite Level 3 -->
  <rect x="470" y="310" width="120" height="80" rx="4" fill="#ffffff"/>

  <!-- Heated Private Plunge Pool -->
  <rect x="440" y="370" width="100" height="40" rx="6" fill="#06b6d4" stroke="#ffffff" stroke-width="3"/>
  <rect x="410" y="390" width="140" height="20" fill="#f1f5f9"/>

  <!-- Bougainvillea Pink Florals -->
  <circle cx="595" cy="245" r="14" fill="#f43f5e"/>
  <circle cx="610" cy="240" r="10" fill="#ec4899"/>
  <circle cx="585" cy="255" r="8" fill="#fda4af"/>

  <!-- Watermark Badge -->
  <rect x="40" y="40" width="280" height="48" rx="8" fill="#000000" fill-opacity="0.45"/>
  <text x="60" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="1.5">SANTORINI, GREECE</text>
</svg>
